<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Task viewer{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/style.css?v={{ version }}">
    <script>
        (function () {
            var stored = localStorage.getItem("task-viewer-theme");
            if (stored === "light" || stored === "dark") {
                document.documentElement.setAttribute("data-theme", stored);
            }
        })();
    </script>
</head>

<body>
    <nav class="navbar">
        <div class="nav-start">
            <a href="/" class="brand">TASK VIEWER</a>
            <div class="nav-tabs">
                <a href="/" class="nav-tab{% if page == "dashboard" %} active{% endif %}">Dashboard</a>
                <a href="/repositories" class="nav-tab{% if page == "repositories" %} active{% endif %}">Repositories</a>
            </div>
        </div>
        <div class="nav-actions">
            {% block nav %}{% endblock %}
            <button class="btn btn-secondary" id="theme-toggle" type="button">Light</button>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <script src="/static/js/theme.js?v={{ version }}"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
