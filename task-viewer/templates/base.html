<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Task viewer{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v={{ version }}">
    <link rel="stylesheet" href="/static/style.css?v={{ version }}">
    <script src="/static/js/theme-boot.js?v={{ version }}"></script>
</head>

<body>
    <nav class="navbar">
        <div class="nav-start">
            <a href="/" class="brand">TASK VIEWER</a>
            <div class="nav-tabs">
                <a href="/" class="nav-tab{% if page == "dashboard" %} active{% endif %}"{% if page == "dashboard" %} aria-current="page"{% endif %}>Dashboard</a>
                <a href="/repositories" class="nav-tab{% if page == "repositories" %} active{% endif %}"{% if page == "repositories" %} aria-current="page"{% endif %}>Repositories</a>
            </div>
        </div>
        <div class="nav-actions">
            {% block nav %}{% endblock %}
            <button class="btn btn-secondary" id="theme-toggle" type="button" aria-pressed="true">Dark theme</button>
        </div>
    </nav>
    <main class="container">
        {% block content %}{% endblock %}
    </main>
    <script src="/static/js/theme.js?v={{ version }}"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
